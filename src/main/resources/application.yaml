# ================================================================
# FinX24 — application.yml
# ================================================================

spring:
  application:
    name: FinX24

  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: FinX24SuperSecretKeyThatIsAtLeast32CharactersLong2024CFSPL
  expiry-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.Finx24: DEBUG
    org.springframework.security: INFO
    # TEMP — logs every incoming request's exact URI (e.g. "GET /api/js/...").
    # Needed to pin down what's being hit repeatedly; safe to remove afterwards.
    org.springframework.web.servlet.DispatcherServlet: DEBUG
  file:
    name: ./logs/finx24.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10

---
# ================================================================
# DEV PROFILE — MySQL
# ================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finx24db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234@Cars}

  jpa:
    hibernate:
      # Creates/updates tables on startup — run once against the empty
      # MySQL schema so the 18 tables exist before importing the CSVs.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

---
# ================================================================
# PROD PROFILE — MySQL
# ================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finx24db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234@Cars}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Existing V1/V2/V3 scripts in db/migration are written in T-SQL
  # (SQL Server) syntax and are NOT MySQL-compatible. Left disabled
  # until those scripts are rewritten for MySQL — ddl-auto handles
  # the schema for now.
  flyway:
    enabled: false